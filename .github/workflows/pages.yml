name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 개발 파일은 저장소에만 두고 사이트로는 내보내지 않는다.
      # upload-pages-artifact는 .git과 .github만 빼므로 나머지는 여기서 지운다.
      # (러너의 작업 사본에서만 지우는 것이라 저장소에는 영향 없음)
      - name: Remove development files
        run: rm -rf tools CLAUDE.md README.md

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
