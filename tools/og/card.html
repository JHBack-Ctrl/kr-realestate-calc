<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 공유 카드 틀(1200×630). tools/og/make_cards.py가 window.CARD를 넣어 그린다. 이 파일을 바꾸면 모든 카드가 다시 그려진다 -->
<style>
@font-face { font-family: P; src: url(FONT_URL) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; font-family: P, sans-serif; background: #f6f4ee; color: #17191c; word-break: keep-all; overflow-wrap: break-word; overflow: hidden; }
.card { position: relative; width: 1200px; height: 630px; padding: 60px 80px 54px; display: flex; flex-direction: column; }
.glow { position: absolute; right: -120px; top: -160px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, #e4f1ec, rgba(228,241,236,0)); }
.top { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; position: relative; }
.mark { width: 46px; height: 46px; border-radius: 14px; background: #0e6b52; position: relative; flex: none; }
.mark::after { content: ""; position: absolute; left: 13px; top: 12px; width: 20px; height: 20px; border: 4px solid #fff; border-radius: 6px; border-top-color: transparent; transform: rotate(45deg); }
.chip { margin-left: 6px; padding: 6px 14px; border-radius: 999px; background: #e4f1ec; color: #0b5642; font-size: 20px; font-weight: 700; white-space: nowrap; }
.mid { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; position: relative; }
.lead { font-size: 46px; font-weight: 700; letter-spacing: -.03em; color: #2b2f35; line-height: 1.25; }
.big { font-size: 104px; font-weight: 850; letter-spacing: -.045em; line-height: 1.08; color: #0e6b52; margin-top: 12px; font-variant-numeric: tabular-nums; }
.big small { font-size: .56em; font-weight: 800; color: #17191c; margin-right: .22em; letter-spacing: -.03em; }
.title { font-size: 60px; font-weight: 800; letter-spacing: -.035em; line-height: 1.17; }
.keys { display: grid; gap: 18px; margin-top: 36px; }
.key { background: #fff; border: 2px solid #e2dfd6; border-top: 6px solid #0e6b52; border-radius: 16px; padding: 16px 22px 18px; min-width: 0; }
.key .k { font-size: 21px; font-weight: 600; color: #4a4f57; line-height: 1.35; }
.key .v { font-size: 40px; font-weight: 850; letter-spacing: -.03em; margin-top: 4px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.sub { font-size: 26px; color: #4a4f57; margin-top: 22px; font-weight: 500; line-height: 1.45; }
.tags { display: flex; gap: 14px; margin-top: 34px; }
.tags span { padding: 14px 26px; border-radius: 999px; background: #e4f1ec; color: #0b5642; font-size: 24px; font-weight: 700; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 22px; color: #656b75; font-weight: 600; position: relative; margin-top: 18px; }
.foot .url { color: #0b5642; font-weight: 700; white-space: nowrap; }
</style></head><body><div class="card"><div class="glow"></div>
<div class="top"><span class="mark"></span>전국부동산계산기<span class="chip" id="chip"></span></div>
<div class="mid" id="mid"></div>
<div class="foot"><span id="foot"></span><span class="url">전국부동산계산기.com</span></div>
</div>
<script>
(function () {
  var c = window.CARD, mid = document.getElementById('mid');
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var chip = document.getElementById('chip'); if (c.chip) chip.textContent = c.chip; else chip.remove();
  document.getElementById('foot').textContent = c.foot || '';
  if (c.kind === 'tool') {
    mid.innerHTML = '<p class="lead">' + esc(c.lead) + '</p><p class="big">' + (c.pre ? '<small>' + esc(c.pre) + '</small>' : '') + esc(c.big) + '</p><p class="sub">' + esc(c.sub) + '</p>';
  } else if (c.kind === 'guide') {
    var n = c.keys.length;
    mid.innerHTML = '<p class="title">' + esc(c.title) + '</p>' + (n ? '<div class="keys" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' +
      c.keys.map(function (k) { return '<div class="key"><p class="k">' + esc(k[1]) + '</p><p class="v">' + esc(k[0]) + '</p></div>'; }).join('') + '</div>' : '');
  } else {
    mid.innerHTML = '<p class="title" style="font-size:84px">' + c.title + '</p><p class="sub">' + esc(c.sub) + '</p><div class="tags">' + c.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>';
  }
  // 넘치면 글자를 조금씩 줄인다: 큰 숫자 한 줄, 핵심 숫자 칸 두 줄, 전체가 가운데 칸 안
  function shrink(el, ok, min) { var fs = parseFloat(getComputedStyle(el).fontSize); while (!ok() && fs > min) { fs -= 2; el.style.fontSize = fs + 'px'; } }
  document.fonts.ready.then(function () {
    var big = mid.querySelector('.big'); if (big) { big.style.whiteSpace = 'nowrap'; shrink(big, function () { return big.scrollWidth <= mid.clientWidth; }, 56); }
    [].forEach.call(mid.querySelectorAll('.key .v'), function (v) { shrink(v, function () { return v.scrollWidth <= v.clientWidth && v.offsetHeight <= parseFloat(getComputedStyle(v).lineHeight) * 2 + 2; }, 22); });
    [].forEach.call(mid.querySelectorAll('.key .k'), function (k) { shrink(k, function () { return k.offsetHeight <= parseFloat(getComputedStyle(k).lineHeight) * 2 + 2; }, 16); });
    var parts = [].slice.call(mid.querySelectorAll('.title, .lead, .sub, .key .v'));
    for (var i = 0; i < 40 && mid.scrollHeight > mid.clientHeight + 1; i++) parts.forEach(function (el) { el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * 0.96) + 'px'; });
    document.body.setAttribute('data-ready', mid.scrollHeight > mid.clientHeight + 1 ? 'overflow' : 'ok');
  });
})();
</script></body></html>
